<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPWS — Login</title>
<style>*{box-sizing:border-box;margin:0}body{background:#0a0c10;color:#e2e8f0;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
form{background:#111318;border:1px solid #1f2530;border-radius:12px;padding:2rem;width:min(92vw,360px)}h1{font-size:1.2rem;margin-bottom:1.25rem}
input,button{width:100%;padding:.75rem 1rem;border-radius:8px;font-size:.95rem;margin-bottom:.75rem}input{background:#181c24;border:1px solid #1f2530;color:inherit}
button{background:#00d4ff;border:0;color:#04121a;font-weight:700;cursor:pointer}.err{color:#ef4444;font-size:.85rem;margin-bottom:.75rem;display:none}</style></head>
<body><form method="post" action="/login"><h1>Student Performance Warning System</h1><div class="err" id="e">Wrong password</div>
<input type="password" name="password" placeholder="Password" required autofocus><button>Sign in</button></form>
<script>if(location.search.includes('error'))document.getElementById('e').style.display='block'</script></body></html>
